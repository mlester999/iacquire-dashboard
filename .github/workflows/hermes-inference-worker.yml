name: Hermes inference worker verification
run-name: Synthetic worker isolation and app checks (${{ github.ref_name }})

on:
  # A branch-scoped push run keeps verification possible without adding this workflow to master.
  push:
    branches:
      - codex/internal-iacquire-activation
      - integration/hermes-bridge-final
    # Any change to the application or its tests runs the whole suite. Until 2026-10-31 only the worker files did, so a push that changed tests or source ran nothing at all.
    paths:
      - services/hermes-inference-worker/**
      - .github/workflows/hermes-inference-worker.yml
      - .github/scripts/**
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - scripts/**
      - supabase/**
      - vitest.config.ts
      - next.config.ts
      - tsconfig*.json
      - eslint.config.mjs
  # GitHub exposes workflow_dispatch only when the workflow exists on the default branch.
  # Kept for future manual use after that separate approval; never targets production.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-inference-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole application suite, TypeScript, lint and the production build, offline, on Linux. The suite is judged by .github/scripts/known-failures.mjs, whose list of recorded
  # failures is empty since 2026-10-31: any failing test file fails the job, and the exact counts are in the failure annotation.
  app-checks:
    name: Full tests, TypeScript, lint (offline) and production build
    if: contains(fromJSON('["codex/internal-iacquire-activation","integration/hermes-bridge-final"]'), github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The whitespace check at the end of this step uses git's default rules, not the cr-at-eol setting that some developer machines keep in .git/config: a carriage return at the
      # end of an added line counts as trailing whitespace here, and it stops this job before the suite runs. Lines added to a CRLF file (.env.example is one) have to be LF.
      # Check locally with: git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab diff --check 7d411f25 HEAD
      - name: Verify the candidate contains the approved changes
        shell: bash
        env:
          # Production master when this candidate was assembled (hardened snapshot, booking fix, chat quality and wording fixes).
          EXPECTED_MASTER_SHA: 7d411f250ec5f4df2e97282bdb4b8d36830b7355
          EXPECTED_WORKER_CANDIDATE_SHA: b9422e475007ef78c6119558f9b9950a13135a05
          EXPECTED_DIAGNOSTIC_SHA: 89ea940a1f45f32c1d229a48bf0fa25b13c1c7ba
          # The other session's last CI repair (isolated-runner lockfile entries, outbound access for the font fetch).
          EXPECTED_CI_REPAIR_SHA: 5cd1f2689c9f2630db3494978be9cb038fe5dc98
        run: |
          set -euo pipefail
          for sha in "$EXPECTED_MASTER_SHA" "$EXPECTED_WORKER_CANDIDATE_SHA" "$EXPECTED_DIAGNOSTIC_SHA" "$EXPECTED_CI_REPAIR_SHA"; do
            git merge-base --is-ancestor "$sha" HEAD
          done
          echo "candidate: $(git rev-parse HEAD)"
          git diff --check "$EXPECTED_MASTER_SHA" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install application dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund --fetch-retries=5 \
            --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000 \
            --fetch-timeout=300000
          docker pull --quiet node:24-bookworm-slim

      - name: Run the full test suite, TypeScript and lint with the network disabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g \
            --env HOME=/tmp --env NEXT_TELEMETRY_DISABLED=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace --entrypoint sh node:24-bookworm-slim -c '
              npm test -- --pool=forks --maxWorkers=2 --reporter=default --reporter=json --outputFile.json=/tmp/vitest-report.json
              echo "vitest exit code: $?"
              # Job logs need a GitHub sign-in to read, so each failing stage is also reported as an annotation.
              report() { if [ "$2" != 0 ]; then echo "::error title=$1::$(tail -n 30 "$3" | tr "\n" "|" | cut -c1-2800)"; fi; }
              node .github/scripts/known-failures.mjs /tmp/vitest-report.json > /tmp/known-failures.log 2>&1
              known=$?
              tail -n 60 /tmp/known-failures.log
              npm run typecheck > /tmp/typecheck.log 2>&1
              types=$?
              tail -n 40 /tmp/typecheck.log
              npm run lint > /tmp/lint.log 2>&1
              lint=$?
              tail -n 40 /tmp/lint.log
              report "Unexpected failing test files" "$known" /tmp/known-failures.log
              report "TypeScript failed" "$types" /tmp/typecheck.log
              report "Lint failed" "$lint" /tmp/lint.log
              if [ "$known" != 0 ] || [ "$types" != 0 ] || [ "$lint" != 0 ]; then exit 1; fi
            '

      # The production build fetches Google Fonts, so it is the one step that needs outbound access (found by the first Linux runs of this workflow); the tests, TypeScript and lint above stay offline.
      - name: Build the production bundle with outbound access for Google Fonts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network bridge --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g \
            --env HOME=/tmp --env NEXT_TELEMETRY_DISABLED=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace --entrypoint sh node:24-bookworm-slim -eu -c \
              'npm run build'

  worker-build-and-smoke:
    name: Build pinned Hermes worker and run synthetic checks
    if: contains(fromJSON('["codex/internal-iacquire-activation","integration/hermes-bridge-final"]'), github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the candidate contains the approved changes
        shell: bash
        env:
          EXPECTED_MASTER_SHA: 7d411f250ec5f4df2e97282bdb4b8d36830b7355
          EXPECTED_WORKER_CANDIDATE_SHA: b9422e475007ef78c6119558f9b9950a13135a05
          EXPECTED_DIAGNOSTIC_SHA: 89ea940a1f45f32c1d229a48bf0fa25b13c1c7ba
          # The other session's last CI repair (isolated-runner lockfile entries, outbound access for the font fetch).
          EXPECTED_CI_REPAIR_SHA: 5cd1f2689c9f2630db3494978be9cb038fe5dc98
        run: |
          set -euo pipefail
          for sha in "$EXPECTED_MASTER_SHA" "$EXPECTED_WORKER_CANDIDATE_SHA" "$EXPECTED_DIAGNOSTIC_SHA" "$EXPECTED_CI_REPAIR_SHA"; do
            git merge-base --is-ancestor "$sha" HEAD
          done
          echo "candidate: $(git rev-parse HEAD)"

      - name: Verify runner and branch scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$(lsb_release -rs)" == "24.04" ]]
          docker version
          docker compose version

      - name: Build the pinned worker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --file services/hermes-inference-worker/Dockerfile \
            --tag iacquire/hermes-inference-worker:ci .

      - name: Run pinned Hermes smoke in an isolated container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --entrypoint /opt/hermes/.venv/bin/python \
            iacquire/hermes-inference-worker:ci -B \
            /opt/iacquire-hermes/inference/pinned_runtime_smoke.py

      - name: Measure synthetic prompts with pinned Hermes and no network
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --entrypoint /opt/hermes/.venv/bin/python \
            iacquire/hermes-inference-worker:ci -B \
            /opt/iacquire-hermes/inference/pinned_prompt_audit_smoke.py

      # The first production audit failed because Hermes writes logs under its home and the worker pointed the home at the
      # read-only profile mount. The smokes above use writable synthetic homes, so this one mounts the profile read-only.
      - name: Run the real worker path against a read-only profile mount with pinned Hermes and no network
        shell: bash
        run: |
          set -euo pipefail
          profiles="$RUNNER_TEMP/readonly-profiles"
          profile="$profiles/iacquire-lead-hunter"
          mkdir -p "$profile"
          printf 'Synthetic read-only profile SOUL.\n' > "$profile/SOUL.md"
          printf 'model:\n  provider: deepseek\n  model: deepseek-v4-pro\nagent:\n  api_max_retries: 1\n  auto_recovery_cycles: 0\n' > "$profile/config.yaml"
          printf 'SYNTHETIC_DECOY_SECRET=never-copy-this-value-0001\nDEEPSEEK_API_KEY=sk-synthetic-readonly-profile-0123456789\nDEEPSEEK_BASE_URL=https://api.deepseek.com\n' > "$profile/.env"
          chmod 0755 "$profiles" "$profile"
          chmod 0644 "$profile/SOUL.md" "$profile/config.yaml" "$profile/.env"
          # Job logs need a GitHub sign-in to read, so a failure is also reported as an annotation (synthetic content only).
          log="$RUNNER_TEMP/readonly-profile-smoke.log"
          if ! docker run --rm --network none --read-only --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --mount "type=bind,source=$profile,target=/profiles/iacquire-lead-hunter,readonly" \
            --entrypoint /opt/hermes/.venv/bin/python \
            iacquire/hermes-inference-worker:ci -B \
            /opt/iacquire-hermes/inference/pinned_readonly_profile_smoke.py > "$log" 2>&1; then
            echo "::error title=Read-only profile smoke failed::$(tail -n 25 "$log" | tr '\n' '|' | cut -c1-3500)"
            exit 1
          fi
          cat "$log"

      # A4a adds an mcp_servers entry to every live profile config, and the worker copies that file unchanged into its throwaway
      # Hermes home. This runs the real worker path with and without such an entry and fails if anything differs. It runs from a bind
      # mount, not from the image, so the image stays byte-identical to the one in production.
      - name: Prove a business MCP entry in a profile config cannot change the worker, with pinned Hermes and no network
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mcp-config-smoke.log"
          if ! docker run --rm --network none --read-only --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --mount "type=bind,source=$GITHUB_WORKSPACE/services/hermes-inference-worker/pinned_mcp_config_smoke.py,target=/opt/iacquire-hermes/inference/pinned_mcp_config_smoke.py,readonly" \
            --entrypoint /opt/hermes/.venv/bin/python \
            iacquire/hermes-inference-worker:ci -B \
            /opt/iacquire-hermes/inference/pinned_mcp_config_smoke.py > "$log" 2>&1; then
            echo "::error title=MCP config smoke failed::$(tail -n 25 "$log" | tr '\n' '|' | cut -c1-3500)"
            exit 1
          fi
          cat "$log"

      # O2: the workers are given a worker-only view of a profile, never the live directory. This builds a view with the real script from
      # synthetic live profiles that carry planted secrets (an API key, a chat token, a business MCP credential, conversation history),
      # checks that none of them is in the view, mounts one view read-only and runs the real worker path against it.
      - name: Build a worker-only profile view with the real script and run the real worker path against it, with pinned Hermes and no network
        shell: bash
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/view-live"
          view="$RUNNER_TEMP/worker-profile-view"
          for profile in iacquire-operations-manager iacquire-lead-hunter iacquire-appointment-setter iacquire-sales-assistant iacquire-crm-manager iacquire-analyst; do
            mkdir -p "$live/$profile/sessions"
            printf 'Synthetic SOUL for %s.\n' "$profile" > "$live/$profile/SOUL.md"
            printf 'model:\n  provider: deepseek\n  model: deepseek-v4-pro\nagent:\n  api_max_retries: 1\n  auto_recovery_cycles: 0\nmcp_servers:\n  iacquire_business:\n    url: https://example.invalid/mcp\n    headers:\n      Authorization: "Bearer ${IACQUIRE_BUSINESS_MCP_TOKEN}"\n' > "$live/$profile/config.yaml"
            printf 'API_SERVER_KEY=planted-api-key-%s-0001\nSLACK_BOT_TOKEN=xoxb-planted-slack-%s-0002\nIACQUIRE_BUSINESS_MCP_TOKEN=iamcp1.planted.credential.%s.0003\nDEEPSEEK_API_KEY=sk-synthetic-view-smoke-0123456789\nDEEPSEEK_BASE_URL=https://api.deepseek.com\n' "$profile" "$profile" "$profile" > "$live/$profile/.env"
            printf 'conversation history planted-history-%s-0004' "$profile" > "$live/$profile/state.db"
            printf 'planted-history-%s-0005' "$profile" > "$live/$profile/sessions/s1.json"
          done
          # Run as root, as on the VPS, so the files get the workers' owner and mode.
          sudo bash scripts/hermes-worker-profile-view.sh sync --live "$live" --view "$view"
          sudo bash scripts/hermes-worker-profile-view.sh check --live "$live" --view "$view"
          test "$(sudo find "$view" -mindepth 2 -type f | wc -l)" = 18
          test "$(sudo find "$view" -mindepth 2 -type d | wc -l)" = 0
          if sudo grep -rqE 'planted-|iamcp1\.' "$view"; then echo "::error title=Planted secret in the worker view::a value from the live profile reached the view"; exit 1; fi
          planted="planted-api-key-iacquire-lead-hunter-0001,xoxb-planted-slack-iacquire-lead-hunter-0002,iamcp1.planted.credential.iacquire-lead-hunter.0003,planted-history-iacquire-lead-hunter-0004,planted-history-iacquire-lead-hunter-0005"
          log="$RUNNER_TEMP/profile-view-smoke.log"
          if ! docker run --rm --network none --read-only --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --mount "type=bind,source=$view/iacquire-lead-hunter,target=/profiles/iacquire-lead-hunter,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/services/hermes-inference-worker/pinned_profile_view_smoke.py,target=/opt/iacquire-hermes/inference/pinned_profile_view_smoke.py,readonly" \
            -e "IACQUIRE_SMOKE_PLANTED=$planted" \
            --entrypoint /opt/hermes/.venv/bin/python \
            iacquire/hermes-inference-worker:ci -B \
            /opt/iacquire-hermes/inference/pinned_profile_view_smoke.py > "$log" 2>&1; then
            echo "::error title=Worker-only profile view smoke failed::$(tail -n 25 "$log" | tr '\n' '|' | cut -c1-3500)"
            exit 1
          fi
          cat "$log"

      - name: Re-run worker policy and failure tests with network disabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            -e IACQUIRE_REQUIRE_PINNED_HERMES=1 \
            --entrypoint /opt/hermes/.venv/bin/python \
            iacquire/hermes-inference-worker:ci -B -m unittest discover \
            -s /opt/iacquire-hermes/inference -p 'test_*.py' -v

      - name: Validate role-specific Compose isolation
        shell: bash
        run: |
          set -euo pipefail
          export IACQUIRE_INFERENCE_HMAC_FILE="$RUNNER_TEMP/synthetic-hmac"
          export IACQUIRE_WORKER_PROFILE_BASE="$RUNNER_TEMP/synthetic-worker-profile-view"
          docker compose -f services/hermes-inference-worker/compose.internal.yaml \
            config --format json > "$RUNNER_TEMP/hermes-worker-compose.json"
          # O2: the old variable must not select what the workers mount. With only it set (as a leftover from the first install would be),
          # Compose has to refuse to render, so a worker can never fall back to the live profile directories by accident.
          if env -u IACQUIRE_WORKER_PROFILE_BASE HERMES_PROFILE_BASE="$RUNNER_TEMP/live-profiles-must-not-be-used" \
            docker compose -f services/hermes-inference-worker/compose.internal.yaml config --format json > /dev/null 2>&1; then
            echo "::error title=Compose still accepts HERMES_PROFILE_BASE::the workers could be pointed at the live profiles without the worker-only view variable"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/hermes-worker-compose.json" "$IACQUIRE_WORKER_PROFILE_BASE" <<'PY'
          import json, os, sys

          with open(sys.argv[1], encoding="utf-8") as source:
              config = json.load(source)
          view_base = sys.argv[2]
          roles = (
              "operations-manager", "lead-hunter", "appointment-setter",
              "sales-assistant", "crm-manager", "performance-analyst",
          )
          services = config["services"]
          assert len(services) == 7, "expected six workers and one egress proxy"
          proxy_name = "iacquire-deepseek-egress-proxy"
          assert proxy_name in services
          for role in roles:
              name = f"iacquire-hermes-inference-worker-{role}"
              service = services[name]
              assert service.get("read_only") is True, name
              assert not service.get("ports"), name
              assert "ALL" in service.get("cap_drop", []), name
              assert "no-new-privileges:true" in service.get("security_opt", []), name
              profiles = [v for v in service.get("volumes", []) if v.get("target", "").startswith("/profiles/")]
              assert len(profiles) == 1 and profiles[0].get("read_only") is True, name
              # O2: that one mount is this employee's directory inside the worker-only view, nothing else is mounted but the HMAC file,
              # and every mount is a read-only bind (no Docker socket, no named or anonymous volume, no live profile directory).
              profile_dir = "iacquire-analyst" if role == "performance-analyst" else f"iacquire-{role}"
              assert profiles[0]["source"] == os.path.join(view_base, profile_dir) and profiles[0]["target"] == f"/profiles/{profile_dir}", (name, profiles[0])
              assert sorted(v.get("target") for v in service["volumes"]) == sorted([f"/profiles/{profile_dir}", "/run/secrets/inference_hmac"]), name
              assert all(v.get("type") == "bind" and v.get("read_only") is True for v in service["volumes"]), name
              attached = set(service["networks"])
              assert "deepseek_egress" not in attached, name
              assert len(attached) == 2, name
              # One tmpfs entry with its options intact: an unquoted comma in the YAML flow list once split it.
              assert service.get("tmpfs") == ["/tmp:rw,noexec,nosuid,nodev,size=32m"], (name, service.get("tmpfs"))
          assert services[proxy_name].get("tmpfs") == ["/tmp:rw,noexec,nosuid,nodev,size=8m"], services[proxy_name].get("tmpfs")
          networks = config["networks"]
          assert networks["deepseek_egress"].get("internal") is not True
          for name, network in networks.items():
              if name != "deepseek_egress":
                  assert network.get("internal") is True, name
          proxy_networks = set(services[proxy_name]["networks"])
          assert "deepseek_egress" in proxy_networks
          print("COMPOSE_ISOLATION_PASS: six one-profile workers, no published ports, only the proxy has external egress")
          PY
