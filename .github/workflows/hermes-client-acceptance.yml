name: Synthetic client Hermes acceptance

on:
  push:
    branches:
      - codex/hermes-gha-acceptance

permissions:
  contents: read

concurrency:
  group: hermes-client-acceptance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-accept:
    name: Build and provision two synthetic tenants
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the branch-scoped candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up the tested Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare isolated Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify runner and branch scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$(lsb_release -rs)" == "24.04" ]]
          [[ "$GITHUB_REF_NAME" == codex/hermes-gha-acceptance ]]
          [[ "$GITHUB_EVENT_NAME" == push ]]
          docker buildx inspect --bootstrap >/dev/null
          docker compose version >/dev/null

      - name: Install isolated app test dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          install_log="$RUNNER_TEMP/npm-ci-${GITHUB_RUN_ID}.log"
          if npm ci --no-fund --fetch-retries=5 \
            --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000 \
            --fetch-timeout=300000 >"$install_log" 2>&1; then
            tail -n 8 "$install_log"
          else
            node --input-type=module - "$install_log" <<'NODE'
          import fs from 'node:fs';

          const log = fs.readFileSync(process.argv[2], 'utf8');
          const diagnosticLines = log.split(/\r?\n/)
            .filter((line) => /npm (?:ERR!|error) (?:code|syscall|errno|network|path|command|enoent|invalid|eresolve|fetch|registry|timeout|missing|lock|in sync)/i.test(line))
            .slice(-12)
            .map((line) => line
              .replace(/(Bearer\s+)\S+/gi, '$1[REDACTED]')
              .replace(/((?:token|password|secret|authorization)[=: ]+)\S+/gi, '$1[REDACTED]')
              .replace(/https?:\/\/[^\s?#]+[?#][^\s]*/gi, '[URL REDACTED]')
              .slice(0, 400));
          for (const line of diagnosticLines) console.log(`NPM_INSTALL_DIAGNOSTIC: ${line}`);
          if (diagnosticLines.length === 0) console.log('NPM_INSTALL_DIAGNOSTIC: no safe structured error lines found');
          NODE
            exit 1
          fi

      - name: Exercise real iAcquireOS onboarding and provisioner routes
        shell: bash
        env:
          NODE_ENV: test
          AUTH_PROVIDER: local
          SECRET_STORE: test-memory
          DATABASE_DRIVER: pglite-memory
          APP_ENCRYPTION_KEY: test-only-key-0123456789abcdef0123456789abcdef
          ALLOW_INSECURE_HERMES_URLS: "true"
        run: |
          set -euo pipefail
          npm test -- tests/client-onboarding-acceptance.test.ts tests/hermes-provisioner-route-acceptance.test.ts

      - name: Build the pinned client Hermes images with Buildx
        shell: bash
        env:
          HERMES_BASE_IMAGE: docker.io/nousresearch/hermes-agent@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
          IACQUIRE_HERMES_IMAGE: iacquire/hermes-client:acceptance
          IACQUIRE_PROVISIONER_IMAGE: iacquire/hermes-provisioner:acceptance
        run: |
          set -euo pipefail
          docker buildx build --pull --platform linux/amd64 --load \
            --file services/hermes-provisioner/Dockerfile \
            --build-arg "HERMES_BASE_IMAGE=$HERMES_BASE_IMAGE" \
            --target hermes-client --tag "$IACQUIRE_HERMES_IMAGE" .
          docker buildx build --pull --platform linux/amd64 --load \
            --file services/hermes-provisioner/Dockerfile \
            --build-arg "HERMES_BASE_IMAGE=$HERMES_BASE_IMAGE" \
            --target provisioner --tag "$IACQUIRE_PROVISIONER_IMAGE" .

      - name: Pull the isolated Node acceptance runtime
        shell: bash
        run: docker pull node:22-bookworm-slim

      - name: Run compatibility and worker security tests in the candidate image
        shell: bash
        env:
          IACQUIRE_PROVISIONER_IMAGE: iacquire/hermes-provisioner:acceptance
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/hermes-candidate-tests-${GITHUB_RUN_ID}.log"
          if docker run --rm --network none --read-only --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/services/hermes-provisioner,target=/repository/services/hermes-provisioner,readonly" \
            --workdir /repository/services/hermes-provisioner --entrypoint /opt/iacquire-hermes/.venv/bin/python \
            "$IACQUIRE_PROVISIONER_IMAGE" -B -m unittest -q \
            test_worker test_deployment test_acceptance_harness test_portal_security_boundary >"$test_log" 2>&1; then
            summary="$(grep -E '^Ran [0-9]+ tests? ' "$test_log" | tail -n1 | sed -E 's/ in .*//')"
            [[ -n "$summary" ]]
            echo "CANDIDATE_COMPATIBILITY_PASS: $summary"
          else
            failure_names="$(grep -E '^(FAIL|ERROR): ' "$test_log" | sed -E 's/^(FAIL|ERROR): ([^ ]+).*/\1: \2/' | head -n 10 || true)"
            if [[ -n "$failure_names" ]]; then
              while IFS= read -r failure_name; do
                echo "CANDIDATE_TEST_FAILURE: $failure_name"
              done <<< "$failure_names"
            fi
            echo "CANDIDATE_COMPATIBILITY_FAIL: test details withheld to keep synthetic credential fixtures out of logs"
            exit 1
          fi

          provider_home="$RUNNER_TEMP/hermes-provider-preflight-${GITHUB_RUN_ID}"
          mkdir -m 0700 "$provider_home"
          cat > "$provider_home/config.yaml" <<'YAML'
          model:
            provider: openai-api
            model: synthetic-fixture
            api_mode: chat_completions
            base_url: http://127.0.0.1:19000/v1
          YAML
          printf '%s\n' 'OPENAI_API_KEY=synthetic-preflight-key-000000000000' > "$provider_home/.env"
          chmod 0400 "$provider_home/config.yaml" "$provider_home/.env"
          if docker run --rm --network none --read-only --user 10000:10000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --env HERMES_HOME=/hermes-home --env HOME=/hermes-home \
            --env OPENAI_API_KEY=synthetic-preflight-key-000000000000 \
            --mount "type=bind,source=$provider_home,target=/hermes-home,readonly" \
            --entrypoint /opt/hermes/.venv/bin/python "$IACQUIRE_PROVISIONER_IMAGE" -B - <<'PY'
          from hermes_cli.runtime_provider import resolve_runtime_provider

          runtime = resolve_runtime_provider()
          assert runtime.get("provider") == "openai-api"
          assert runtime.get("api_mode") == "chat_completions"
          assert runtime.get("base_url") == "http://127.0.0.1:19000/v1"
          assert runtime.get("api_key") == "synthetic-preflight-key-000000000000"
          print("SYNTHETIC_MODEL_ROUTE_PASS: pinned Hermes resolves the local fixture without external credentials")
          PY
          then
            rm -rf -- "$provider_home"
          else
            rm -rf -- "$provider_home"
            echo "SYNTHETIC_MODEL_ROUTE_FAIL: pinned Hermes did not resolve the isolated local route"
            exit 1
          fi

      - name: Create one-run synthetic credentials and local TLS
        shell: bash
        env:
          HERMES_BASE_IMAGE: docker.io/nousresearch/hermes-agent@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
          IACQUIRE_HERMES_IMAGE: iacquire/hermes-client:acceptance
          IACQUIRE_PROVISIONER_IMAGE: iacquire/hermes-provisioner:acceptance
        run: |
          set -euo pipefail
          umask 077
          temp_dir="$RUNNER_TEMP/hermes-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$temp_dir" in "$RUNNER_TEMP"/hermes-candidate-*) ;; *) exit 1 ;; esac
          mkdir "$temp_dir"
          mkdir "$temp_dir/results"
          chmod 0777 "$temp_dir/results"

          hermes_api_key="$(openssl rand -hex 32)"
          provisioner_token="$(openssl rand -hex 32)"
          portal_token="$(openssl rand -hex 32)"
          model_key="$(openssl rand -hex 32)"
          gateway_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          printf '::add-mask::%s\n' "$hermes_api_key" "$provisioner_token" "$portal_token" "$model_key"
          printf '%s\n' "$hermes_api_key" > "$temp_dir/hermes-api-key"
          printf '%s\n' "$provisioner_token" > "$temp_dir/provisioner-token"
          printf '%s\n' "$portal_token" > "$temp_dir/portal-admin-token"
          MODEL_KEY="$model_key" TEMP_DIR="$temp_dir" python3 - <<'PY'
          import json, os
          with open(os.environ["TEMP_DIR"] + "/profile-model-env.json", "w", encoding="ascii") as output:
              json.dump({"schemaVersion": 1, "environment": "OPENAI_API_KEY", "value": os.environ["MODEL_KEY"]}, output, separators=(",", ":"))
              output.write("\n")
          PY

          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout "$temp_dir/acceptance-key.pem" \
            -out "$temp_dir/acceptance-cert.pem" \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:portal-acceptance" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "extendedKeyUsage=serverAuth" >/dev/null 2>&1

          cat > "$temp_dir/client-config.yaml" <<'YAML'
          model:
            provider: openai-api
            model: synthetic-fixture
            api_mode: chat_completions
            base_url: http://127.0.0.1:19000/v1
          gateway:
            multiplex_profiles: true
            api_server:
              enabled: true
              host: 0.0.0.0
              port: 8642
              max_concurrent_runs: 1
          platform_toolsets:
            api_server: [memory, session_search, todo, vision, web, no_mcp]
          agent:
            disabled_toolsets: [browser, code_execution, computer_use, connections, cronjob, delegation, file, image_gen, skills, terminal, catalog, kanban]
          terminal:
            backend: docker
            docker_forward_env: []
            container_persistent: false
          YAML

          sudo chown "10000:10000" "$temp_dir/hermes-api-key" "$temp_dir/provisioner-token" \
            "$temp_dir/portal-admin-token" \
            "$temp_dir/profile-model-env.json" "$temp_dir/client-config.yaml" \
            "$temp_dir/acceptance-key.pem" "$temp_dir/acceptance-cert.pem"
          sudo chmod 0400 "$temp_dir/hermes-api-key" "$temp_dir/provisioner-token" \
            "$temp_dir/portal-admin-token" \
            "$temp_dir/profile-model-env.json" "$temp_dir/client-config.yaml" \
            "$temp_dir/acceptance-key.pem" "$temp_dir/acceptance-cert.pem"
          for private_file in "$temp_dir/hermes-api-key" "$temp_dir/provisioner-token" \
            "$temp_dir/portal-admin-token" \
            "$temp_dir/profile-model-env.json" "$temp_dir/client-config.yaml" \
            "$temp_dir/acceptance-key.pem" "$temp_dir/acceptance-cert.pem"; do
            [[ "$(stat -c '%u:%g:%a' "$private_file")" == "10000:10000:400" ]]
          done

          cat > "$temp_dir/compose.env" <<EOF
          HERMES_BASE_IMAGE=$HERMES_BASE_IMAGE
          IACQUIRE_HERMES_IMAGE=$IACQUIRE_HERMES_IMAGE
          IACQUIRE_PROVISIONER_IMAGE=$IACQUIRE_PROVISIONER_IMAGE
          HERMES_CLIENT_CONFIG_FILE=$temp_dir/client-config.yaml
          HERMES_API_KEY_FILE=$temp_dir/hermes-api-key
          HERMES_PROFILE_MODEL_ENV_FILE=$temp_dir/profile-model-env.json
          IACQUIRE_PROVISIONER_TOKEN_FILE=$temp_dir/provisioner-token
          PORTAL_ACCEPTANCE_ADMIN_TOKEN_FILE=$temp_dir/portal-admin-token
          IACQUIRE_PROVISIONER_URL=https://127.0.0.1:18443
          IACQUIRE_PROVISIONER_GATEWAY_ID=$gateway_id
          IACQUIRE_HERMES_PRIVATE_NETWORK=iacquire-hermes-private-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          ACCEPTANCE_CA_CERT_FILE=$temp_dir/acceptance-cert.pem
          ACCEPTANCE_TLS_KEY_FILE=$temp_dir/acceptance-key.pem
          ACCEPTANCE_HARNESS_FILE=$GITHUB_WORKSPACE/services/hermes-provisioner/acceptance_harness.py
          ACCEPTANCE_RESULT_DIR=$temp_dir/results
          EOF
          chmod 0600 "$temp_dir/compose.env"

          {
            echo "HERMES_ACCEPTANCE_DIR=$temp_dir"
            echo "HERMES_ACCEPTANCE_PROJECT=iacquire-hermes-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Validate the isolated Compose candidate
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-name "$HERMES_ACCEPTANCE_PROJECT" \
            --env-file "$HERMES_ACCEPTANCE_DIR/compose.env" \
            -f services/hermes-provisioner/compose.client.yaml \
            -f services/hermes-provisioner/compose.acceptance.yaml \
            -f services/hermes-provisioner/compose.portal-acceptance.yaml \
            --profile provisioner --profile acceptance config --quiet

      - name: Run the candidate gateway and synthetic provisioner
        shell: bash
        run: |
          set -euo pipefail
          compose_base=(docker compose --project-name "$HERMES_ACCEPTANCE_PROJECT" \
            --env-file "$HERMES_ACCEPTANCE_DIR/compose.env" \
            -f services/hermes-provisioner/compose.client.yaml \
            -f services/hermes-provisioner/compose.acceptance.yaml \
            --profile provisioner --profile acceptance)
          if ! "${compose_base[@]}" up --no-build -d; then
            echo "CLIENT_RUNTIME_START_FAILURE: Compose could not start the candidate gateway."
            "${compose_base[@]}" ps --all || true
            client_id="$("${compose_base[@]}" ps --all -q hermes-client | head -n 1)"
            if [[ -n "$client_id" ]]; then
              docker inspect -f 'CLIENT_STATE={{.State.Status}} EXIT={{.State.ExitCode}} OOM={{.State.OOMKilled}} RESTARTS={{.RestartCount}} HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} HEALTH_FAILURES={{if .State.Health}}{{.State.Health.FailingStreak}}{{else}}0{{end}}' "$client_id"
              health_codes="$(docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' "$client_id" 2>/dev/null \
                | grep -Eo 'ConnectionRefusedError|TimeoutError|PermissionError|FileNotFoundError|ModuleNotFoundError|ImportError|Connection refused|Read-only file system|Permission denied|No such file or directory|Address already in use|HTTP Error [0-9]{3}' \
                | sort -u | paste -sd, - || true)"
              echo "CLIENT_HEALTH_FAILURE_CODES=${health_codes:-unclassified}"
              runtime_codes="$(docker logs "$client_id" 2>&1 | python3 -c 'import sys; text = sys.stdin.read().lower(); rules = (("api_key_secret_unavailable", "api_key_secret_unavailable"), ("api_key_secret_invalid", "api_key_secret_invalid"), ("permission_denied", "permission denied"), ("operation_not_permitted", "operation not permitted"), ("missing_file", "no such file or directory"), ("read_only_write", "read-only file system"), ("address_in_use", "address already in use"), ("connection_refused", "connection refused"), ("timeout", "timed out"), ("python_traceback", "traceback (most recent call last)"), ("configuration_error", "invalid config")); codes = sorted({code for code, phrase in rules if phrase in text}); print(",".join(codes[:8]) if codes else ("no_runtime_output" if not text.strip() else ("unclassified_runtime_error" if any(term in text for term in ("error", "fatal", "exception", "failed")) else "runtime_output_without_error_marker")))')"
              echo "CLIENT_RUNTIME_FAILURE_CODES=${runtime_codes:-none}"
              exception_types="$(docker logs "$client_id" 2>&1 | python3 -c 'import re, sys; pattern = re.compile(r"\b([A-Z][A-Za-z0-9]*(?:Error|Exception|Exit|Failure))(?=\s*(?::|$))"); types = sorted({match.group(1) for line in sys.stdin for match in pattern.finditer(line)}); print(",".join(types[:8]))')"
              echo "CLIENT_EXCEPTION_TYPES=${exception_types:-none}"
            fi
            exit 1
          fi

          client_id="$(docker compose --project-name "$HERMES_ACCEPTANCE_PROJECT" \
            --env-file "$HERMES_ACCEPTANCE_DIR/compose.env" \
            -f services/hermes-provisioner/compose.client.yaml \
            -f services/hermes-provisioner/compose.acceptance.yaml \
            --profile provisioner --profile acceptance ps --all -q hermes-client | head -n 1)"
          harness_id="$(docker compose --project-name "$HERMES_ACCEPTANCE_PROJECT" \
            --env-file "$HERMES_ACCEPTANCE_DIR/compose.env" \
            -f services/hermes-provisioner/compose.client.yaml \
            -f services/hermes-provisioner/compose.acceptance.yaml \
            --profile provisioner --profile acceptance ps --all -q acceptance-harness | head -n 1)"
          worker_id="$(docker compose --project-name "$HERMES_ACCEPTANCE_PROJECT" \
            --env-file "$HERMES_ACCEPTANCE_DIR/compose.env" \
            -f services/hermes-provisioner/compose.client.yaml \
            -f services/hermes-provisioner/compose.acceptance.yaml \
            --profile provisioner --profile acceptance ps --all -q hermes-provisioner | head -n 1)"
          if [[ -z "$client_id" || -z "$harness_id" || -z "$worker_id" ]]; then
            [[ -n "$client_id" ]] || echo "SANDBOX_CONTAINER_ID_MISSING=hermes-client"
            [[ -n "$harness_id" ]] || echo "SANDBOX_CONTAINER_ID_MISSING=acceptance-harness"
            [[ -n "$worker_id" ]] || echo "SANDBOX_CONTAINER_ID_MISSING=hermes-provisioner"
            for id in "$client_id" "$harness_id" "$worker_id"; do
              [[ -n "$id" ]] && docker inspect -f 'SANDBOX_CONTAINER_STATE={{.Name}} STATUS={{.State.Status}} EXIT={{.State.ExitCode}} OOM={{.State.OOMKilled}}' "$id"
            done
            exit 1
          fi

          sudo python3 - "$client_id" "$harness_id" "$worker_id" "$HERMES_ACCEPTANCE_DIR" <<'PY'
          import json, pathlib, subprocess, sys
          client_id, harness_id, worker_id, temp_dir = sys.argv[1:]
          def inspect(container):
              return json.loads(subprocess.check_output(["docker", "inspect", container], text=True))[0]
          client, harness, worker = map(inspect, (client_id, harness_id, worker_id))
          for item in (client, harness, worker):
              assert item["HostConfig"]["Privileged"] is False
              assert all("docker.sock" not in mount["Source"] for mount in item["Mounts"])
              assert all("/docker/hermes-agent-wpwm" not in mount["Source"] for mount in item["Mounts"])
              ports = item["NetworkSettings"].get("Ports") or {}
              assert not any(ports.values())
          network_names = set(client["NetworkSettings"]["Networks"])
          assert any("client_egress" in name for name in network_names)
          assert any(name.startswith("iacquire-hermes-private-ci-") for name in network_names)
          for network_name in network_names:
              network = json.loads(subprocess.check_output(["docker", "network", "inspect", network_name], text=True))[0]
              assert network["Internal"] is True
          assert client["HostConfig"]["ReadonlyRootfs"] is True
          assert "ALL" in {cap.removeprefix("CAP_") for cap in client["HostConfig"]["CapDrop"]}
          assert {cap.removeprefix("CAP_") for cap in client["HostConfig"]["CapAdd"]} == {"CHOWN", "KILL", "SETGID", "SETUID"}
          assert "no-new-privileges:true" in client["HostConfig"]["SecurityOpt"]
          tmpfs = client["HostConfig"]["Tmpfs"]
          assert "/run" in tmpfs and "/tmp" in tmpfs
          assert "exec" in tmpfs["/run"].split(",")
          assert "noexec" in tmpfs["/tmp"].split(",")
          client_mounts = {mount["Destination"]: mount for mount in client["Mounts"]}
          assert client_mounts["/opt/data/config.yaml"]["RW"] is False
          assert client_mounts["/run/secrets/hermes_api_key"]["RW"] is False
          assert worker["Config"]["User"] == "10000:10000"
          assert worker["HostConfig"]["ReadonlyRootfs"] is True
          assert "ALL" in worker["HostConfig"]["CapDrop"]
          assert harness["Config"]["User"] == "10000:10000"
          assert harness["HostConfig"]["ReadonlyRootfs"] is True
          assert "ALL" in harness["HostConfig"]["CapDrop"]
          values = "\n".join(worker["Config"]["Env"])
          for filename in ("hermes-api-key", "provisioner-token"):
              secret = (pathlib.Path(temp_dir) / filename).read_text(encoding="ascii").strip()
              assert secret not in values
          model = json.loads((pathlib.Path(temp_dir) / "profile-model-env.json").read_text(encoding="ascii"))["value"]
          assert model not in values
          for name in ("IACQUIRE_PROVISIONER_TOKEN=", "HERMES_PROVISIONER_BOOTSTRAP_API_KEY=", "OPENAI_API_KEY=", "DATABASE_URL="):
              assert name not in values
          print("SECURITY_BOUNDARY_PASS: read-only Hermes gateway image, four gateway capabilities, isolated s6 writable paths, non-root worker, read-only filesystems, internal-only acceptance networks, no Docker socket, no host Hermes data bind, no published ports, no inline credentials")
          PY

          deadline=$((SECONDS + 2100))
          while [[ ! -f "$HERMES_ACCEPTANCE_DIR/results/status.json" ]]; do
            harness_state="$(docker inspect -f '{{.State.Status}}' "$harness_id")"
            worker_state="$(docker inspect -f '{{.State.Status}}' "$worker_id")"
            if [[ "$harness_state" == exited || "$worker_state" == exited || "$SECONDS" -ge "$deadline" ]]; then
              break
            fi
            sleep 5
          done

          if [[ ! -f "$HERMES_ACCEPTANCE_DIR/results/status.json" ]]; then
            echo "SANDBOX_FAIL: synthetic acceptance did not produce a result; container state is available without printing service logs"
            printf 'harness='
            docker inspect -f '{{.State.Status}}/{{.State.ExitCode}}' "$harness_id" || true
            printf 'worker='
            docker inspect -f '{{.State.Status}}/{{.State.ExitCode}}' "$worker_id" || true
            worker_code="$(docker logs "$worker_id" 2>&1 | grep -E '^Hermes provisioner stopped: [a-z0-9_]+$' | tail -n 1 || true)"
            if [[ -n "$worker_code" ]]; then
              echo "SANDBOX_WORKER_CODE: ${worker_code#Hermes provisioner stopped: }"
            fi
            exit 1
          fi

          python3 - "$HERMES_ACCEPTANCE_DIR/results/status.json" <<'PY'
          import json, re, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("result") != "SANDBOX_PASS":
              result_kind = result.get("result")
              print("SANDBOX_ACCEPTANCE_RESULT: " + (result_kind if result_kind in {"SANDBOX_PASS", "SANDBOX_FAIL"} else "unknown"))
              known_fields = ("result", "failure", "workerFailureCode", "modelCalls", "modelChatCalls", "modelAuthenticationFailures", "auditEventsObserved")
              print("SANDBOX_ACCEPTANCE_FIELDS: " + ",".join(field for field in known_fields if field in result))
              failure = result.get("failure")
              if isinstance(failure, str) and re.fullmatch(r"[a-z0-9_]{1,80}", failure):
                  print("SANDBOX_ACCEPTANCE_FAILURE_CODE: " + failure)
              elif failure is None:
                  print("SANDBOX_ACCEPTANCE_FAILURE_CODE: missing")
              else:
                  print("SANDBOX_ACCEPTANCE_FAILURE_CODE: invalid")
              worker_failure = result.get("workerFailureCode")
              if isinstance(worker_failure, str) and re.fullmatch(r"[a-z0-9_]{1,80}", worker_failure):
                  print("SANDBOX_WORKER_FAILURE_CODE: " + worker_failure)
              for key, marker in (
                  ("modelCalls", "SANDBOX_DIAGNOSTIC_MODEL_CALLS"),
                  ("modelChatCalls", "SANDBOX_DIAGNOSTIC_MODEL_CHAT_CALLS"),
                  ("modelAuthenticationFailures", "SANDBOX_DIAGNOSTIC_MODEL_AUTH_FAILURES"),
              ):
                  value = result.get(key)
                  if isinstance(value, int) and not isinstance(value, bool) and 0 <= value <= 10000:
                      print(f"{marker}: {value}")
              for key, marker in (
                  ("auditEventsObserved", "SANDBOX_DIAGNOSTIC_AUDIT_EVENTS"),
                  ("auditSucceededObserved", "SANDBOX_DIAGNOSTIC_AUDIT_SUCCEEDED"),
                  ("auditFailedObserved", "SANDBOX_DIAGNOSTIC_AUDIT_FAILED"),
                  ("auditRejectedObserved", "SANDBOX_DIAGNOSTIC_AUDIT_REJECTED"),
                  ("auditProvisionObserved", "SANDBOX_DIAGNOSTIC_AUDIT_PROVISION"),
                  ("auditSyncObserved", "SANDBOX_DIAGNOSTIC_AUDIT_SYNC"),
                  ("auditRecoveryFailureObserved", "SANDBOX_DIAGNOSTIC_AUDIT_RECOVERY_FAILURE"),
              ):
                  value = result.get(key)
                  if isinstance(value, int) and not isinstance(value, bool) and 0 <= value <= 10000:
                      print(f"{marker}: {value}")
              raise SystemExit(1)
          expected = {
              "result": "SANDBOX_PASS",
              "syntheticTenants": 2,
              "uniqueProfiles": 12,
              "rolesPerTenant": 6,
              "completionAttempts": 15,
              "recoveredFailures": 1,
              "idempotentDuplicateChecks": 1,
              "configurationSyncChecks": 1,
              "effectiveSoulsVerified": 12,
              "isolatedProfileKeys": 12,
              "crossTenantDenials": 72,
              "profileKeyDenials": 132,
              "auditEvents": 15,
              "auditSecretLeaks": 0,
              "modelAuthenticationFailures": 0,
              "externalNetwork": "disabled",
          }
          for key, value in expected.items():
              assert result.get(key) == value, f"acceptance result mismatch: {key}"
          assert result.get("canaryModelCalls", 0) >= 15
          print("SANDBOX_PASS: " + json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

      - name: Provision through real iAcquireOS routes and verify Hermes state
        shell: bash
        run: |
          set -euo pipefail
          portal_failure_phase=portal_startup
          portal_report_failure() {
            local status=$?
            if [[ "$status" -ne 0 ]]; then
              echo "::error title=Portal Hermes acceptance failed::PORTAL_FAILURE_PHASE=${portal_failure_phase}"
            fi
          }
          trap portal_report_failure EXIT

          compose() {
            docker compose --project-name "$HERMES_ACCEPTANCE_PROJECT" \
              --env-file "$HERMES_ACCEPTANCE_DIR/compose.env" \
              -f services/hermes-provisioner/compose.client.yaml \
              -f services/hermes-provisioner/compose.acceptance.yaml \
              -f services/hermes-provisioner/compose.portal-acceptance.yaml \
              --profile provisioner --profile acceptance "$@"
          }

          portal_failure_phase=model_fixture_lifecycle
          harness_id="$(compose ps --all -q acceptance-harness | head -n 1)"
          client_id="$(compose ps --all -q hermes-client | head -n 1)"
          if [[ -z "$harness_id" || -z "$client_id" || "$(docker inspect -f '{{.State.Status}}' "$harness_id")" != running ]]; then
            echo "::error title=Synthetic model fixture unavailable::MODEL_FIXTURE_LIFECYCLE_FAIL"
            exit 1
          fi
          if ! docker exec "$client_id" /opt/hermes/.venv/bin/python -c \
            'import urllib.request; r=urllib.request.urlopen("http://127.0.0.1:19000/healthz", timeout=5); raise SystemExit(0 if r.status == 200 else 1)'; then
            echo "::error title=Synthetic model fixture unavailable::MODEL_FIXTURE_HEALTH_FAIL"
            exit 1
          fi
          echo "SYNTHETIC_MODEL_FIXTURE_LIFECYCLE_PASS: loopback model fixture stayed available after runtime recovery acceptance"

          report_model_diagnostic() {
            local model_diagnostic
            model_diagnostic="$(python3 - "$HERMES_ACCEPTANCE_DIR/results/model-diagnostics.json" <<'PY'
          import json, sys
          fields = (
              "requests", "authorizedRequests", "chatRequests", "authorizedChatRequests",
              "authenticationFailures", "successResponses", "errorResponses", "invalidRequests",
              "missingChallengeMarker", "endpointNotFound",
          )
          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  payload = json.load(source)
              current = payload.get("counters")
              baseline = payload.get("portalPhaseBaseline")
              if payload.get("schemaVersion") != 1 or not isinstance(current, dict) or not isinstance(baseline, dict):
                  raise ValueError("diagnostic_shape_invalid")
              deltas = {}
              for field in fields:
                  value = current.get(field)
                  before = baseline.get(field)
                  if any(not isinstance(item, int) or isinstance(item, bool) or item < 0 for item in (value, before)) or value < before:
                      raise ValueError("diagnostic_counter_invalid")
                  deltas[field] = value - before
              print("PORTAL_MODEL_DIAGNOSTIC=" + json.dumps({"available": True, "deltas": deltas}, separators=(",", ":")))
          except (OSError, ValueError, TypeError, json.JSONDecodeError):
              print('PORTAL_MODEL_DIAGNOSTIC={"available":false}')
          PY
          )"
            echo "$model_diagnostic"
            echo "::warning title=Portal model fixture counters::${model_diagnostic}"
          }

          report_portal_status() {
            local status_json="$1"
            local diagnostic
            diagnostic="$(STATUS_JSON="$status_json" python3 - <<'PY'
          import json, os, re
          status = json.loads(os.environ["STATUS_JSON"])
          keys = ("mappedProfiles", "provisionRequested", "provisionInProgress", "provisionAwaitingHealthCheck", "provisionSucceeded", "failedJobs")
          counts = {}
          for key in keys:
              value = status.get(key)
              counts[key] = value if isinstance(value, int) and value >= 0 else -1
          raw_codes = status.get("failedCodes")
          codes = sorted({code for code in raw_codes if isinstance(code, str) and re.fullmatch(r"[a-z_]{1,64}", code)}) if isinstance(raw_codes, list) else []
          if counts["failedJobs"] > 0 and not codes:
              codes = ["unclassified_provisioner_failure"]
          allowed_stages = {"canary_verification", "profile_creation", "profile_route_verification", "runtime_policy_verification", "lease_validation", "provisioning", "in_progress"}
          allowed_categories = {"unclassified_hermes_run_failure", "hermes_run_failure", "soul_challenge_mismatch", "profile_creation_failure", "authenticated_profile_route_failure", "lease_expired", "provisioner_failure", "unclassified_provisioner_failure", "none_recorded"}
          allowed_retry = {"in_progress", "retry_scheduled", "retry_exhausted", "retry_not_scheduled"}
          allowed_detail = {"Terminal Hermes run had no allowlisted error code.", "Canary output did not match the one-time challenge.", "Authenticated canary event stream was unavailable.", "No failure recorded yet."}
          uuid = re.compile(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}")
          diagnostics = []
          raw_diagnostics = status.get("jobDiagnostics")
          if isinstance(raw_diagnostics, list):
              for item in raw_diagnostics:
                  if not isinstance(item, dict) or not isinstance(item.get("correlationId"), str) or not uuid.fullmatch(item["correlationId"]):
                      continue
                  stage = item.get("stage") if item.get("stage") in allowed_stages else "provisioning"
                  category = item.get("errorCategory") if item.get("errorCategory") in allowed_categories else "unclassified_provisioner_failure"
                  retry = item.get("retryState") if item.get("retryState") in allowed_retry else "retry_not_scheduled"
                  detail = item.get("safeExceptionDetail")
                  if not (detail in allowed_detail or (isinstance(detail, str) and re.fullmatch(r"(?:Hermes canary run reported|Allowlisted provisioner failure): [a-z0-9_]{1,80}\.", detail))):
                      detail = "Unclassified provisioner failure."
                  attempt = item.get("attempt")
                  if not isinstance(attempt, int) or isinstance(attempt, bool) or not 0 <= attempt <= 3:
                      attempt = 0
                  job_status = item.get("jobStatus") if item.get("jobStatus") in {"failed", "in_progress"} else "failed"
                  diagnostics.append({"correlationId": item["correlationId"], "jobStatus": job_status, "stage": stage, "errorCategory": category, "safeExceptionDetail": detail, "attempt": attempt, "maxAttempts": 3, "retryState": retry})
                  if len(diagnostics) == 12:
                      break
          print("PORTAL_PROVISIONING_DIAGNOSTIC=" + json.dumps({**counts, "failedCodes": codes[:12], "jobDiagnostics": diagnostics}, separators=(",", ":")))
          PY
          )"
            echo "$diagnostic"
            echo "::warning title=Portal provisioning state::${diagnostic}"
            report_model_diagnostic
          }

          portal_status_state() {
            local status_json="$1"
            local phase="$2"
            STATUS_JSON="$status_json" PHASE="$phase" \
              PYTHONPATH="$GITHUB_WORKSPACE/services/hermes-provisioner" python3 - <<'PY'
          import json, os
          from acceptance_harness import _portal_status_state
          print(_portal_status_state(json.loads(os.environ["STATUS_JSON"]), os.environ["PHASE"]))
          PY
          }

          compose up -d --no-build portal-acceptance
          portal_failure_phase=portal_health
          # Include stopped containers: an early Node startup failure makes plain `ps -q`
          # return an empty ID, which otherwise hides the useful exit and health evidence.
          portal_id="$(compose ps --all -q portal-acceptance | head -n 1)"
          if [[ -z "$portal_id" ]]; then
            portal_compose_state="$(compose ps --all --format '{{.Service}}={{.State}}' portal-acceptance 2>/dev/null \
              | tr -cd '[:alnum:]_.=() -\n' | head -n 1 || true)"
            echo "PORTAL_DIAGNOSTIC_CONTAINER_STATE=${portal_compose_state:-missing}"
            echo "::warning title=Portal container state::PORTAL_DIAGNOSTIC_CONTAINER_STATE=${portal_compose_state:-missing}"
            echo "PORTAL_HERMES_E2E_FAIL: synthetic portal container was not found"
            exit 1
          fi
          deadline=$((SECONDS + 180))
          while true; do
            portal_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$portal_id")"
            if [[ "$portal_health" == healthy ]]; then break; fi
            if [[ "$portal_health" == unhealthy || "$portal_health" == exited || "$portal_health" == dead || "$SECONDS" -ge "$deadline" ]]; then
              portal_state="$(docker inspect -f '{{.State.Status}}/exit={{.State.ExitCode}}/oom={{.State.OOMKilled}}/health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$portal_id")"
              health_exit_codes="$(docker inspect -f '{{range .State.Health.Log}}{{.ExitCode}} {{end}}' "$portal_id" | tr -cd '0-9 -')"
              echo "PORTAL_DIAGNOSTIC_STATE=${portal_state}"
              echo "::warning title=Portal health state::PORTAL_DIAGNOSTIC_STATE=${portal_state}"
              echo "PORTAL_DIAGNOSTIC_HEALTH_EXIT_CODES=${health_exit_codes:-none}"
              echo "::warning title=Portal health probes::PORTAL_DIAGNOSTIC_HEALTH_EXIT_CODES=${health_exit_codes:-none}"
              health_output="$(docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' "$portal_id" 2>/dev/null || true)"
              portal_logs="$(docker logs "$portal_id" 2>&1 || true)"
              if grep -Fq 'PORTAL_ACCEPTANCE_READY' <<< "$portal_logs"; then
                echo 'PORTAL_DIAGNOSTIC_READY_MARKER=present'
                echo '::warning title=Portal startup marker::PORTAL_DIAGNOSTIC_READY_MARKER=present'
              else
                echo 'PORTAL_DIAGNOSTIC_READY_MARKER=absent'
                echo '::warning title=Portal startup marker::PORTAL_DIAGNOSTIC_READY_MARKER=absent'
              fi
              for marker in \
                ERR_TLS_CERT_ALTNAME_INVALID UNABLE_TO_VERIFY_LEAF_SIGNATURE \
                DEPTH_ZERO_SELF_SIGNED_CERT SELF_SIGNED_CERT_IN_CHAIN \
                ERR_MODULE_NOT_FOUND ERR_PACKAGE_PATH_NOT_EXPORTED MODULE_NOT_FOUND \
                EACCES ENOENT ECONNREFUSED ECONNRESET ETIMEDOUT EADDRINUSE \
                acceptance_fixture_missing acceptance_test_environment_required; do
                if grep -Fq "$marker" <<< "$health_output$portal_logs"; then
                  echo "PORTAL_DIAGNOSTIC_ERROR_CODE=${marker}"
                  echo "::warning title=Portal error code::PORTAL_DIAGNOSTIC_ERROR_CODE=${marker}"
                fi
              done
              startup_failure="$(grep -Eo 'PORTAL_ACCEPTANCE_STARTUP_FAILURE=[A-Z0-9_]+' <<< "$portal_logs" | head -n 1 || true)"
              if [[ -n "$startup_failure" ]]; then
                echo "$startup_failure"
                echo "::warning title=Portal startup failure::${startup_failure}"
              fi
              echo "PORTAL_HERMES_E2E_FAIL: synthetic portal did not become healthy"
              exit 1
            fi
            sleep 5
          done

          portal_failure_phase=portal_seed_request
          portal_seed_errors="$HERMES_ACCEPTANCE_DIR/results/portal-seed-diagnostics.log"
          if ! compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs seed \
            > "$HERMES_ACCEPTANCE_DIR/results/portal-seed.json" 2> "$portal_seed_errors"; then
            seed_diagnostic="$(grep -Eo 'PORTAL_ACCEPTANCE_SEED_FAILURE stage=[a-z_]+ code=[A-Za-z0-9_]+|PORTAL_ACCEPTANCE_REQUEST_FAILURE status=[1-5][0-9]{2}' \
              "$portal_seed_errors" | head -n 1 || true)"
            if [[ -n "$seed_diagnostic" ]]; then
              echo "::error title=Portal seed diagnosis::${seed_diagnostic}"
            else
              echo '::error title=Portal seed diagnosis::PORTAL_ACCEPTANCE_SEED_DIAGNOSTIC_UNAVAILABLE'
            fi
            exit 1
          fi
          portal_failure_phase=portal_seed_validation
          python3 - "$HERMES_ACCEPTANCE_DIR/results/portal-seed.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          assert result == {"createdTenants": 2, "rolesPerTenant": 6, "requestedProvisionJobs": 12, "heldReviewsApproved": result["heldReviewsApproved"]}
          assert isinstance(result["heldReviewsApproved"], int) and result["heldReviewsApproved"] >= 0
          print("PORTAL_SEED_PASS: two synthetic organizations, twelve pending profile jobs, held configs reviewed")
          PY

          # The first sandbox already completed on this isolated Hermes home. Point the same restricted worker
          # at the actual test Route Handlers and let the real worker create a second, tenant-unique set of profiles.
          portal_failure_phase=portal_worker_restart
          compose up -d --no-build --force-recreate hermes-provisioner
          portal_failure_phase=portal_provisioning
          deadline=$((SECONDS + 2100))
          while true; do
            status_json="$(compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs status)"
            provision_state="$(portal_status_state "$status_json" provision)"
            if [[ "$provision_state" == failed ]]; then
              settle_deadline=$((SECONDS + 240))
              while [[ "$(STATUS_JSON="$status_json" python3 -c 'import json,os; print(json.loads(os.environ["STATUS_JSON"]).get("provisionInProgress",0))')" != 0 && "$SECONDS" -lt "$settle_deadline" ]]; do
                sleep 5
                status_json="$(compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs status)"
              done
              report_portal_status "$status_json"
              echo "PORTAL_HERMES_E2E_FAIL: a synthetic profile provisioning job failed"
              if [[ "$(STATUS_JSON="$status_json" python3 -c 'import json,os; print(json.loads(os.environ["STATUS_JSON"]).get("provisionInProgress",0))')" != 0 ]]; then
                echo "PORTAL_HERMES_E2E_FAIL: a synthetic worker lease did not settle within the diagnostic drain window"
              fi
              exit 1
            fi
            if [[ "$provision_state" == ready ]]; then break; fi
            if [[ "$SECONDS" -ge "$deadline" ]]; then
              report_portal_status "$status_json"
              echo "PORTAL_HERMES_E2E_FAIL: provisioning did not reach health verification"
              exit 1
            fi
            sleep 5
          done

          portal_failure_phase=portal_health_check
          health_json="$(compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs health-check)"
          HEALTH_JSON="$health_json" python3 - <<'PY'
          import json, os
          result = json.loads(os.environ["HEALTH_JSON"])
          assert result.get("checked") == 12 and result.get("online") == 12
          PY

          portal_failure_phase=portal_sync_request
          compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs sync >/dev/null
          portal_failure_phase=portal_sync_poll
          deadline=$((SECONDS + 900))
          while true; do
            status_json="$(compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs status)"
            sync_state="$(portal_status_state "$status_json" sync)"
            if [[ "$sync_state" == failed ]]; then
              report_portal_status "$status_json"
              echo "PORTAL_HERMES_E2E_FAIL: synthetic profile configuration sync failed"
              exit 1
            fi
            if [[ "$sync_state" == ready ]]; then break; fi
            if [[ "$SECONDS" -ge "$deadline" ]]; then
              report_portal_status "$status_json"
              echo "PORTAL_HERMES_E2E_FAIL: configuration sync did not reach health verification"
              exit 1
            fi
            sleep 5
          done

          portal_failure_phase=portal_sync_health_check
          sync_health="$(compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs health-check)"
          SYNC_HEALTH="$sync_health" python3 - <<'PY'
          import json, os
          result = json.loads(os.environ["SYNC_HEALTH"])
          assert result.get("checked") == 12 and result.get("online") == 12
          PY

          portal_failure_phase=portal_final_status
          final_status="$(compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs status)"
          FINAL_STATUS="$final_status" python3 - <<'PY'
          import json, os
          status = json.loads(os.environ["FINAL_STATUS"])
          assert status.get("employees") == 12
          assert status.get("onlineEmployees") == 12
          assert status.get("profileVersionsMatch") == 12
          assert status.get("provisionSucceeded") == 12
          assert status.get("provisionRequested") == 0
          assert status.get("provisionInProgress") == 0
          assert status.get("syncSucceeded") == 1
          assert status.get("syncRequested") == 0
          assert status.get("syncInProgress") == 0
          assert status.get("failedJobs") == 0
          assert status.get("duplicateCallbackReplays") == 1
          print("PORTAL_JOB_STATE_PASS: 12 profiles online, twelve provisions and one approved configuration sync succeeded")
          PY

          portal_failure_phase=portal_runtime_evidence
          compose exec -T portal-acceptance node scripts/hermes-provisioner-acceptance-client.mjs evidence \
            > "$HERMES_ACCEPTANCE_DIR/results/portal-evidence.json"
          chmod 0444 "$HERMES_ACCEPTANCE_DIR/results/portal-evidence.json"
          portal_failure_phase=portal_runtime_verification
          compose exec -T hermes-provisioner /opt/iacquire-hermes/.venv/bin/python -B /opt/iacquire-hermes/verify_portal_acceptance.py

          portal_failure_phase=portal_security_checks
          portal_id="$(compose ps -q portal-acceptance)"
          client_id="$(compose ps -q hermes-client)"
          worker_id="$(compose ps -q hermes-provisioner)"
          # Acceptance secrets are mode 0400 and owned by the container UID 10000.
          # Run this read-only Docker/file audit as root so it can inspect those inputs
          # without loosening their permissions or changing ownership.
          sudo python3 services/hermes-provisioner/verify_portal_security_boundary.py \
            "$portal_id" "$client_id" "$worker_id" \
            "$HERMES_ACCEPTANCE_DIR" "$GITHUB_WORKSPACE"
          portal_failure_phase=portal_acceptance_complete

      - name: Remove all synthetic containers, networks, volumes, and credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_dir="$RUNNER_TEMP/hermes-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_dir="${HERMES_ACCEPTANCE_DIR:-$expected_dir}"
          if [[ "$candidate_dir" != "$expected_dir" ]]; then
            echo "SANDBOX_CLEANUP_FAIL: refusing to remove an unexpected path"
            exit 1
          fi
          if [[ -d "$candidate_dir" ]]; then
            if [[ -f "$candidate_dir/compose.env" ]]; then
              docker compose --project-name "iacquire-hermes-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                --env-file "$candidate_dir/compose.env" \
                -f services/hermes-provisioner/compose.client.yaml \
                -f services/hermes-provisioner/compose.acceptance.yaml \
                -f services/hermes-provisioner/compose.portal-acceptance.yaml \
                --profile provisioner --profile acceptance down --volumes --remove-orphans --timeout 15 >/dev/null 2>&1 || \
                echo "SANDBOX_CLEANUP_WARNING: Compose teardown failed; the hosted runner will be discarded"
            fi
            rm -rf -- "$candidate_dir"
          fi
