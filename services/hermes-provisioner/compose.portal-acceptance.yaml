services:
  portal-acceptance:
    profiles: [acceptance]
    image: node:22-bookworm-slim
    pull_policy: never
    restart: "no"
    user: "10000:10000"
    read_only: true
    init: true
    working_dir: /repository
    command: ["node", "--conditions=react-server", "--import", "tsx", "scripts/hermes-provisioner-acceptance-server.ts"]
    environment:
      NODE_ENV: test
      AUTH_PROVIDER: local
      SECRET_STORE: test-memory
      DATABASE_DRIVER: pglite-memory
      APP_ENCRYPTION_KEY: test-only-key-0123456789abcdef0123456789abcdef
      ALLOW_INSECURE_HERMES_URLS: "true"
      HERMES_PROVISIONER_ENABLED: "true"
      HERMES_PROVISIONER_GATEWAY_ID: ${IACQUIRE_PROVISIONER_GATEWAY_ID:?Set a synthetic gateway UUID}
      HERMES_PROVISIONER_TOKEN_FILE: /run/secrets/provisioner_token
      PORTAL_ACCEPTANCE_ADMIN_TOKEN_FILE: /run/secrets/portal_acceptance_admin
      PORTAL_ACCEPTANCE_CERT_FILE: /run/secrets/acceptance-cert.pem
      PORTAL_ACCEPTANCE_KEY_FILE: /run/secrets/acceptance-key.pem
      PORTAL_ACCEPTANCE_PORT: "18444"
      PORTAL_ACCEPTANCE_HOST: 0.0.0.0
      NODE_EXTRA_CA_CERTS: /run/secrets/acceptance-cert.pem
      HOME: /tmp
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    depends_on:
      hermes-client:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../..
        target: /repository
        read_only: true
      - type: bind
        source: ${IACQUIRE_PROVISIONER_TOKEN_FILE:?Set the synthetic worker token file}
        target: /run/secrets/provisioner_token
        read_only: true
      - type: bind
        source: ${PORTAL_ACCEPTANCE_ADMIN_TOKEN_FILE:?Set the synthetic acceptance admin token file}
        target: /run/secrets/portal_acceptance_admin
        read_only: true
      - type: bind
        source: ${ACCEPTANCE_CA_CERT_FILE:?Set the synthetic acceptance certificate}
        target: /run/secrets/acceptance-cert.pem
        read_only: true
      - type: bind
        source: ${ACCEPTANCE_TLS_KEY_FILE:?Set the synthetic acceptance private key}
        target: /run/secrets/acceptance-key.pem
        read_only: true
    networks:
      - client_egress
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 2m
        max-file: "2"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('https://127.0.0.1:18444/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  hermes-provisioner:
    environment:
      IACQUIRE_PROVISIONER_URL: https://portal-acceptance:18444
      ACCEPTANCE_RESULT_EVIDENCE_FILE: /run/acceptance-results/portal-evidence.json
    depends_on:
      portal-acceptance:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${ACCEPTANCE_RESULT_DIR:?Set the synthetic acceptance result directory}
        target: /run/acceptance-results
        read_only: true
      - type: bind
        source: ./verify_portal_acceptance.py
        target: /opt/iacquire-hermes/verify_portal_acceptance.py
        read_only: true

networks:
  client_egress:
    internal: true
